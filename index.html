<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple vintage Calculator | Ahsan habib</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="apple.png" type="image/png">
</head>
<body>
    <div class="box">
        <input type="text" id="display" readonly placeholder="0">
       <p>
       <button title="1" class="btn_1" onclick="">1</button>
       <button title="2" class="btn_1" onclick="">2</button>
       <button title="3" class="btn_1" onclick="">3</button>
       <button title="+" class="btn_2" onclick="">+</button>
       </p>
       <p>
       <button title="4" class="btn_1" onclick="">4</button>
       <button title="5" class="btn_1" onclick="">5</button>
       <button title="6" class="btn_1" onclick="">6</button>
       <button title="-" class="btn_2" onclick="">-</button>
       </p>
       <p>
        <button title="7" class="btn_1" onclick="">7</button>
        <button title="8" class="btn_1" onclick="">8</button>
        <button title="9" class="btn_1" onclick="">9</button>
        <button title="*" class="btn_2" onclick="">*</button>
       </p>
       <p>
        <button title="0" class="btn_1" onclick="">0</button>
        <button title="." class="btn_1" onclick="">.</button>
        <button title="=" class="btn_1" onclick="">=</button>
        <button title="/" class="btn_2" onclick="">/</button>
       </p>
       <p>
        <button title="Clear" class="btn1">C</button>
       </p>
    </div>

    <p class="footer-text">
        Created by Ahsan habib &copy; 2026
    </p>
    
    <script src="index.js">
    </script>
</body>
</html>
